<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebTV API</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --fg: #e8eaf0;
        --muted: #8b93a7;
        --accent: #e50914;
        --card: #141821;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #1a2030 0%, var(--bg) 60%);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: min(560px, 100%); }
      h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
      h1 span { color: var(--accent); }
      p { color: var(--muted); line-height: 1.5; }
      .card {
        margin-top: 20px;
        background: var(--card);
        border: 1px solid #232936;
        border-radius: 14px;
        padding: 18px;
      }
      code {
        display: block;
        padding: 10px 12px;
        margin: 8px 0;
        background: #0a0c11;
        border: 1px solid #1d232e;
        border-radius: 8px;
        color: #9ad3ff;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        overflow-x: auto;
      }
      a { color: #9ad3ff; }
      small { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Web<span>TV</span> API</h1>
      <p>Proxy do catalogo de canais. Resolve o CORS de <code>embedcanais.online</code> para o frontend estatico.</p>
      <div class="card">
        <small>CATALOGO</small>
        <code>GET /channels</code>
        <code>GET /channels?fresh=1</code>
        <small>STATUS</small>
        <code>GET /health</code>
        <p style="margin-bottom: 0">
          <a href="/channels">Abrir /channels</a> &middot;
          <a href="https://hellfiveosborn.github.io/WebTV/v2/">Abrir o WebTV v2</a>
        </p>
      </div>
    </main>
  </body>
</html>
