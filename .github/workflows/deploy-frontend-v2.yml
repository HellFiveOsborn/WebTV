name: Deploy Frontend v2 to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend-v2/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Testes: parser (unit + live contra o site) e backend (CORS).
      - name: Test
        run: npm test

      # Gera public/data/embedcanais.json a partir do site real.
      # Falhas de rede nao quebram o build (o script mantem o snapshot anterior).
      - name: Fetch channels snapshot
        run: npm run fetch:channels

      - name: Build
        run: npm run build:offline

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
