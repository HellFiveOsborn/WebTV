<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebTV - Canais</title>
    <meta name="description" content="Catalogo de canais do embedcanais.online" />
    <script>
      /*
       * Aplica o tema salvo ANTES da primeira pintura, evitando o
       * "flash" de tema claro em quem prefere o escuro.
       * Mesma logica de src/lib/theme.ts (mantida em duplicado de forma
       * proposital: este script roda antes do bundle).
       */
      (function () {
        try {
          var saved = localStorage.getItem('webtv:v2:theme')
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'light' ? 'light' : 'dark',
          )
        } catch (e) {
          /* localStorage indisponivel: mantem o dark padrao */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
