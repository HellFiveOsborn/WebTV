<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Embed Canais TV — Canais ao vivo</title>
<meta name="description" content="Explore canais ao vivo em uma interface moderna e responsiva.">
<meta name="robots" content="index,follow">
<meta name="author" content="Embed Canais">
<meta name="theme-color" content="#00f3fe">
<link rel="icon" href="/icons/icon2026.png" sizes="32x32">
<link rel="icon" href="/icons/icon2026.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/icon2026.png">

<style>
:root {
  color-scheme: dark;
  --bg: #090e13;
  --bg-2: #0c1218;
  --header: #00f3fe;
  --panel: #10171f;
  --panel-2: #141d27;
  --panel-3: #18232f;
  --line: #22303d;
  --line-soft: #18232d;
  --text: #f5f9fc;
  --muted: #91a2b3;
  --muted-2: #6f8192;
  --accent: #00f3fe;
  --accent-strong: #4ff8ff;
  --accent-soft: rgba(0,243,254,.10);
  --accent-soft-2: rgba(0,243,254,.16);
  --success: #76f7b3;
  --shadow: 0 18px 55px rgba(0,0,0,.24);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -180px, rgba(0,243,254,.07), transparent 420px),
    var(--bg);
  color: var(--text);
  font: 500 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, a { font: inherit; }
button { border: 0; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; }
::selection { background: rgba(0,243,254,.28); color: #fff; }

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  min-height: 76px;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 12px clamp(18px, 3vw, 42px);
  border-bottom: 1px solid rgba(0,0,0,.15);
  background: var(--header);
  box-shadow: 0 8px 28px rgba(0,0,0,.14);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 150px;
}
.brand img {
  width: 42px;
  height: 42px;
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.12));
}
.brand-text {
  display: grid;
  line-height: .92;
  font-weight: 950;
  letter-spacing: -.55px;
  text-transform: uppercase;
  color: #041012;
}
.brand-text strong { font-size: 15px; }
.brand-text span { margin-top: 4px; font-size: 15px; }

.main-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.main-nav a {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  padding: 0 15px;
  border-radius: 11px;
  color: rgba(1,19,21,.70);
  font-weight: 800;
  transition: .18s ease;
}
.main-nav a:hover,
.main-nav a.active {
  color: #031113;
  background: rgba(0,0,0,.09);
}

.header-search {
  position: relative;
  width: min(370px, 30vw);
  margin-left: auto;
}
.header-search svg,
.hero-search svg {
  position: absolute;
  left: 16px;
  top: 50%;
  width: 20px;
  height: 20px;
  transform: translateY(-50%);
  fill: none;
  stroke-width: 2;
  pointer-events: none;
}
.header-search svg { stroke: rgba(0,0,0,.52); }
.header-search input {
  width: 100%;
  height: 46px;
  padding: 0 18px 0 45px;
  border: 1px solid rgba(0,0,0,.12);
  border-radius: 999px;
  outline: none;
  background: rgba(0,0,0,.10);
  color: #021012;
  font-weight: 700;
  transition: .18s ease;
}
.header-search input::placeholder { color: rgba(0,0,0,.52); }
.header-search input:focus {
  border-color: rgba(0,0,0,.30);
  background: rgba(255,255,255,.18);
  box-shadow: 0 0 0 4px rgba(0,0,0,.06);
}

.mobile-nav-toggle {
  display: none;
  width: 42px;
  height: 42px;
  margin-left: auto;
  place-items: center;
  border: 1px solid rgba(0,0,0,.14);
  border-radius: 11px;
  background: rgba(0,0,0,.10);
  color: #031113;
  cursor: pointer;
}
.mobile-nav-toggle svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}

.page {
  width: min(1600px, 100%);
  margin: 0 auto;
  padding: 42px clamp(16px, 3vw, 42px) 70px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 28px;
  margin-bottom: 28px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.eyebrow::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 16px rgba(0,243,254,.75);
}
.page-title {
  margin: 0;
  max-width: 780px;
  color: #f7fbfd;
  font-size: clamp(32px, 3.2vw, 52px);
  line-height: 1.01;
  letter-spacing: -1.9px;
}
.page-subtitle {
  max-width: 760px;
  margin: 13px 0 0;
  color: var(--muted);
  font-size: clamp(15px, 1.25vw, 18px);
}
.hero-guide {
  min-width: 270px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 17px;
  border: 1px solid rgba(0,243,254,.18);
  border-radius: 15px;
  background: linear-gradient(145deg, rgba(0,243,254,.10), rgba(0,243,254,.035));
}
.hero-guide-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 11px;
  background: var(--accent);
  color: #031113;
}
.hero-guide-icon svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
}
.hero-guide-copy { display: grid; gap: 2px; }
.hero-guide-copy strong { font-size: 14px; color: #f5fbfd; }
.hero-guide-copy span { color: var(--muted); font-size: 12px; }

.filter-panel {
  position: relative;
  z-index: 10;
  margin-bottom: 24px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(15,22,30,.92);
  box-shadow: 0 14px 40px rgba(0,0,0,.11);
}
.filter-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
}
.hero-search {
  position: relative;
  width: 100%;
}
.hero-search input {
  width: 100%;
  height: 56px;
  padding: 0 20px 0 54px;
  border: 1px solid #2a3947;
  border-radius: 14px;
  outline: none;
  background: #0b1117;
  color: var(--text);
  font-size: 16px;
  transition: .18s ease;
}
.hero-search svg {
  left: 19px;
  width: 21px;
  height: 21px;
  stroke: var(--muted);
}
.hero-search input::placeholder { color: #738698; }
.hero-search input:focus {
  border-color: rgba(0,243,254,.62);
  box-shadow: 0 0 0 4px rgba(0,243,254,.09);
}
.filter-tip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-right: 6px;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}
.filter-tip svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
}

.category-strip {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 14px;
  overflow-x: auto;
  padding: 1px 0 4px;
  scrollbar-width: none;
}
.category-strip::-webkit-scrollbar { display: none; }
.category-chip {
  flex: 0 0 auto;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  border: 1px solid #283846;
  border-radius: 999px;
  background: #111923;
  color: #9eafbf;
  cursor: pointer;
  transition: .17s ease;
}
.category-chip:hover {
  color: #e8fcfe;
  border-color: rgba(0,243,254,.34);
  background: rgba(0,243,254,.06);
}
.category-chip.active {
  border-color: var(--accent);
  background: var(--accent);
  color: #031113;
  font-weight: 850;
  box-shadow: 0 9px 28px rgba(0,243,254,.15);
}
.category-chip .chip-icon {
  width: 17px;
  height: 17px;
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
}
.category-chip .chip-icon svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.results-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 12px;
  padding: 11px 3px 0;
  border-top: 1px solid rgba(255,255,255,.05);
}
.results {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.results strong { color: var(--text); }
.copy-hint {
  color: var(--muted-2);
  font-size: 12px;
}
.copy-hint b { color: var(--accent); font-weight: 800; }

.category-sections {
  display: grid;
  gap: 38px;
}
.category-section { min-width: 0; }
.category-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 15px;
}
.category-title-wrap {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 11px;
}
.category-icon {
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border: 1px solid rgba(0,243,254,.18);
  border-radius: 11px;
  background: var(--accent-soft);
  color: var(--accent);
}
.category-icon svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.category-title {
  margin: 0;
  color: #f0f6f9;
  font-size: clamp(22px, 1.8vw, 28px);
  line-height: 1.1;
  letter-spacing: -.65px;
}
.category-tools {
  display: flex;
  align-items: center;
  gap: 13px;
}
.category-total {
  color: var(--muted-2);
  font-size: 13px;
  font-weight: 750;
}
.see-all-btn {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 11px;
  border: 1px solid rgba(0,243,254,.16);
  border-radius: 10px;
  background: rgba(0,243,254,.06);
  color: var(--accent);
  font-size: 13px;
  font-weight: 850;
  cursor: pointer;
  transition: .17s ease;
}
.see-all-btn:hover {
  border-color: rgba(0,243,254,.42);
  background: rgba(0,243,254,.11);
}
.see-all-btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.channel-carousel-wrap {
  position: relative;
  min-width: 0;
}

.channel-grid {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 2px 2px 12px;
  scroll-behavior: smooth;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
}
.channel-grid::-webkit-scrollbar { display: none; }

.channel-grid .channel-card {
  flex: 0 0 clamp(218px, 16.5vw, 252px);
  scroll-snap-align: start;
}

.carousel-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}

.carousel-arrow {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid #2a3a47;
  border-radius: 10px;
  background: #121b23;
  color: #a9bac7;
  cursor: pointer;
  transition: .17s ease;
}
.carousel-arrow:hover {
  border-color: rgba(0,243,254,.44);
  background: rgba(0,243,254,.09);
  color: var(--accent);
}
.carousel-arrow:disabled {
  opacity: .34;
  cursor: default;
  border-color: #26343f;
  background: #10171e;
  color: #667682;
}
.carousel-arrow svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.carousel-count {
  min-width: 48px;
  color: var(--muted-2);
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}

.channel-carousel-wrap::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 12px;
  width: 34px;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(9,14,19,.82));
  opacity: .72;
  transition: opacity .18s ease;
}
.channel-carousel-wrap.at-end::after {
  opacity: 0;
}
.channel-card {
  min-width: 0;
  overflow: hidden;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: linear-gradient(180deg, #111922 0%, #0f161e 100%);
  box-shadow: 0 7px 22px rgba(0,0,0,.07);
  transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.channel-card:hover {
  transform: translateY(-2px);
  border-color: #344858;
  background: linear-gradient(180deg, #131d27 0%, #101820 100%);
  box-shadow: var(--shadow);
}
.card-top {
  min-height: 27px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #c5d1da;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .25px;
  text-transform: uppercase;
}
.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(0,243,254,.55);
}
.card-category {
  max-width: 58%;
  overflow: hidden;
  color: var(--muted-2);
  font-size: 10px;
  font-weight: 750;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.logo-box {
  position: relative;
  height: 112px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 20px 23px;
  border: 1px solid rgba(255,255,255,.035);
  border-radius: 12px;
  background:
    radial-gradient(circle at 50% 0%, rgba(0,243,254,.055), transparent 70%),
    var(--panel-2);
}
.logo-box img {
  position: relative;
  z-index: 1;
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 62px;
  object-fit: contain;
  object-position: center;
}
.card-name {
  margin: 12px 2px 11px;
  overflow: hidden;
  color: #f3f7fa;
  font-size: 15px;
  font-weight: 800;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
}
.card-copy,
.card-preview {
  min-width: 0;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border-radius: 10px;
  cursor: pointer;
  transition: .17s ease;
}
/* Botão principal: assistir */
.card-preview {
  padding: 0 11px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #021113;
  font-size: 12px;
  font-weight: 900;
  box-shadow: 0 8px 22px rgba(0,243,254,.10);
}
.card-preview:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
  transform: translateY(-1px);
}
/* Botão secundário: copiar iframe */
.card-copy {
  width: 42px;
  padding: 0;
  border: 1px solid #2a3946;
  background: #151f29;
  color: #a8b7c4;
}
.card-copy:hover {
  border-color: rgba(0,243,254,.42);
  background: rgba(0,243,254,.08);
  color: var(--accent);
}
.card-copy.copied {
  border-color: var(--success);
  background: var(--success);
  color: #062317;
}
.card-copy svg,
.card-preview svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card-copy span { display: none; }

.empty {
  display: none;
  min-height: 280px;
  place-items: center;
  grid-column: 1 / -1;
  border: 1px dashed #2b3a47;
  border-radius: 18px;
  background: #0d141b;
  color: var(--muted);
  text-align: center;
}
.empty.show { display: grid; }
.empty h2 { margin: 0 0 6px; color: #e8f0f4; font-size: 20px; }
.empty p { margin: 0; }

.player-modal {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: none;
  place-items: center;
  padding: 26px;
  background: rgba(1,5,8,.84);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.player-modal.open { display: grid; }
.player-shell {
  width: min(1180px, 100%);
  overflow: hidden;
  border: 1px solid #2c3b48;
  border-radius: 18px;
  background: #05080c;
  box-shadow: 0 30px 100px rgba(0,0,0,.58);
}
.player-head {
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px 10px 16px;
  border-bottom: 1px solid var(--line-soft);
  background: #0f161d;
}
.player-head img {
  width: 34px;
  height: 34px;
  object-fit: contain;
}
.player-copy { min-width: 0; display: grid; }
.player-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-copy span { margin-top: 2px; color: var(--muted); font-size: 12px; }
.player-actions {
  display: flex;
  gap: 7px;
  margin-left: auto;
}
.player-actions button {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #141e27;
  color: #acbbc8;
  cursor: pointer;
  transition: .17s ease;
}
.player-actions button:hover {
  color: var(--accent);
  border-color: rgba(0,243,254,.38);
  background: rgba(0,243,254,.07);
}
.player-actions .copy-embed-modal {
  width: auto;
  min-width: 132px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border-color: var(--accent);
  background: var(--accent);
  color: #021113;
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}
.player-actions .copy-embed-modal:hover {
  background: var(--accent-strong);
  color: #021113;
}
.player-actions button.copied {
  color: #062317;
  border-color: var(--success);
  background: var(--success);
}
.player-actions svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}
.player-stage {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
}
.player-stage iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

@media (max-width: 980px) {
  .site-header { min-height: 70px; flex-wrap: wrap; gap: 10px; padding: 11px 18px; }
  .mobile-nav-toggle { display: grid; }
  .main-nav {
    order: 3;
    width: 100%;
    display: none;
    overflow-x: auto;
    padding-top: 2px;
  }
  body.nav-open .main-nav { display: flex; }
  .header-search {
    order: 4;
    display: none;
    width: 100%;
    margin-left: 0;
  }
  body.nav-open .header-search { display: block; }
  .hero { grid-template-columns: 1fr; align-items: start; }
  .hero-guide { min-width: 0; max-width: 430px; }
  .page { padding-top: 32px; }
}

@media (max-width: 720px) {
  .page { padding: 25px 12px 48px; }
  .hero { gap: 19px; margin-bottom: 20px; }
  .page-title { font-size: 34px; letter-spacing: -1.3px; }
  .page-subtitle { font-size: 15px; }
  .filter-panel { padding: 12px; border-radius: 16px; }
  .filter-top { grid-template-columns: 1fr; gap: 10px; }
  .filter-tip { display: none; }
  .hero-search input { height: 52px; font-size: 14px; }
  .category-chip { min-height: 38px; padding: 0 14px; font-size: 13px; }
  .results-row { margin-top: 9px; }

const state = {
  query: '',
  category: 'all',
  current: null
};

const categoryOrder = [
  'Canais Abertos',
  'Variedades',
  'Esportes',
  'Filmes e Séries',
  'Infantil',
  'Notícias',
  'Religiosos'
];

const categoryLabels = {
  'Variedades': 'Entretenimento'
};

const collator = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });
const sectionsEl = document.getElementById('categorySections');
const emptyState = document.getElementById('emptyState');
const mainSearch = document.getElementById('mainSearch');
const headerSearch = document.getElementById('headerSearch');
const categoryStrip = document.getElementById('categoryStrip');

function esc(value) {
  return String(value).replace(/[&<>'"]/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
  }[c]));
}


function buildCategories() {
  const available = new Set(CHANNELS.map(c => c.category));
  const ordered = categoryOrder.filter(c => available.has(c));
  [...available].filter(c => !ordered.includes(c)).sort(collator.compare).forEach(c => ordered.push(c));

  const allIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`;
  const chips = [
    `<button class="category-chip active" type="button" data-category="all"><span class="chip-icon">${allIcon}</span><span>Todas</span></button>`,
    ...ordered.map(cat =>
      `<button class="category-chip" type="button" data-category="${esc(cat)}"><span class="chip-icon">${categoryIcon(cat)}</span><span>${esc(categoryLabels[cat] || cat)}</span></button>`
    )
  ];
  categoryStrip.innerHTML = chips.join('');
}

function getFiltered() {
  const q = state.query.trim().toLocaleLowerCase('pt-BR');
  return CHANNELS
    .filter(c => state.category === 'all' || c.category === state.category)
    .filter(c => !q || `${c.name} ${c.category} ${c.slug}`.toLocaleLowerCase('pt-BR').includes(q))
    .sort((a, b) => collator.compare(a.name, b.name));
}

function getGrouped(filtered) {
  const grouped = new Map();
  for (const channel of filtered) {
    if (!grouped.has(channel.category)) grouped.set(channel.category, []);
    grouped.get(channel.category).push(channel);
  }

  const orderedKeys = categoryOrder.filter(cat => grouped.has(cat));
  [...grouped.keys()]
    .filter(cat => !orderedKeys.includes(cat))
    .sort(collator.compare)
    .forEach(cat => orderedKeys.push(cat));

  return orderedKeys.map(cat => ({
    key: cat,
    label: categoryLabels[cat] || cat,
    items: grouped.get(cat) || []
  }));
}

function categoryIcon(category) {
  const icons = {
    'Canais Abertos': `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m8 3 4 3 4-3"/></svg>`,
    'Variedades': `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16"/><path d="M7 15v-3a5 5 0 0 1 10 0v3"/><path d="M9 6h6"/><path d="M12 3v3"/></svg>`,
    'Esportes': `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 9 4-3 4 3-1.5 5h-5z"/><path d="M4.5 10.5 8 9M16 9l3.5 1.5M9.5 14 7 18M14.5 14 17 18"/></svg>`,
    'Filmes e Séries': `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M17 9h4M3 15h4M17 15h4"/></svg>`,
    'Infantil': `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h8l2 4-2 8H8l-2-8z"/><path d="m9 6 1-3h4l1 3"/><circle cx="10" cy="12" r="1"/><circle cx="14" cy="12" r="1"/><path d="M10 15h4"/></svg>`,
    'Notícias': `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10M7 17h10"/><rect x="15" y="8" width="2" height="3"/></svg>`,
    'Religiosos': `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M8 7h8"/><path d="M5 21h14"/></svg>`
  };
  return icons[category] || `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>`;
}

function cardTemplate(c) {
  return `<article class="channel-card" data-slug="${esc(c.slug)}">
    <div class="card-top">
      <span class="live-pill"><span class="live-dot"></span>Disponível</span>
      <span class="card-category">${esc(categoryLabels[c.category] || c.category)}</span>
    </div>
    <div class="logo-box">
      <img loading="lazy" decoding="async" src="${esc(c.image)}" alt="${esc(c.name)}">
    </div>
    <h2 class="card-name">${esc(c.name)}</h2>
    <div class="card-actions">
      <button class="card-preview" type="button" data-preview="${esc(c.slug)}" title="Assistir ${esc(c.name)}" aria-label="Assistir ${esc(c.name)}">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span>Assistir</span>
      </button>
      <button class="card-copy" type="button" data-copy-embed="${esc(c.slug)}" title="Copiar iframe" aria-label="Copiar iframe de ${esc(c.name)}">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        <span>Copiar iframe</span>
      </button>
    </div>
  </article>`;
}

function sectionTemplate(group) {
  return `<section class="category-section" data-section-category="${esc(group.key)}">
    <header class="category-head">
      <div class="category-title-wrap">
        <span class="category-icon">${categoryIcon(group.key)}</span>
        <h2 class="category-title">${esc(group.label)}</h2>
      </div>
      <div class="category-tools">
        <span class="category-total">${group.items.length} canais</span>
        <div class="carousel-controls" aria-label="Navegação do carrossel ${esc(group.label)}">
          <button class="carousel-arrow" type="button" data-carousel-prev="${esc(group.key)}" aria-label="Canais anteriores de ${esc(group.label)}" disabled>
            <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <span class="carousel-count" aria-hidden="true">${group.items.length}</span>
          <button class="carousel-arrow" type="button" data-carousel-next="${esc(group.key)}" aria-label="Próximos canais de ${esc(group.label)}">
            <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="channel-carousel-wrap">
      <div class="channel-grid" data-carousel="${esc(group.key)}">${group.items.map(cardTemplate).join('')}</div>
    </div>
  </section>`;
}

function render() {
  const list = getFiltered();
  const groups = getGrouped(list);
  sectionsEl.innerHTML = groups.map(sectionTemplate).join('');
  document.getElementById('resultsText').textContent =
    `${list.length} canal${list.length === 1 ? '' : 'is'} encontrado${list.length === 1 ? '' : 's'}`;

  emptyState.classList.toggle('show', list.length === 0);
  sectionsEl.style.display = list.length ? 'grid' : 'none';

  sectionsEl.querySelectorAll('.logo-box img').forEach(img => {
    img.addEventListener('error', () => {
      img.style.visibility = 'hidden';
    }, { once: true });
  });

  requestAnimationFrame(() => {
    sectionsEl.querySelectorAll('[data-carousel]').forEach(updateCarouselState);
  });
}

function updateCarouselState(track) {
  if (!track) return;

  const section = track.closest('.category-section');
  if (!section) return;

  const prev = section.querySelector('[data-carousel-prev]');
  const next = section.querySelector('[data-carousel-next]');
  const wrap = track.closest('.channel-carousel-wrap');

  const maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
  const atStart = track.scrollLeft <= 4;
  const atEnd = track.scrollLeft >= maxScroll - 4 || maxScroll <= 4;

  if (prev) prev.disabled = atStart;
  if (next) next.disabled = atEnd;
  if (wrap) wrap.classList.toggle('at-end', atEnd);
}

function moveCarousel(track, direction) {
  if (!track) return;

  const firstCard = track.querySelector('.channel-card');
  const styles = getComputedStyle(track);
  const gap = parseFloat(styles.columnGap || styles.gap || 14) || 14;
  const cardWidth = firstCard ? firstCard.getBoundingClientRect().width : 230;
  const visibleCards = Math.max(1, Math.floor(track.clientWidth / (cardWidth + gap)));
  const amount = Math.max(cardWidth + gap, (cardWidth + gap) * Math.max(1, visibleCards - 1));

  track.scrollBy({
    left: direction * amount,
    behavior: 'smooth'
  });
}

function setQuery(value, source) {
  state.query = value;
  if (source !== mainSearch) mainSearch.value = value;
  if (source !== headerSearch) headerSearch.value = value;
  render();
}

async function copyEmbed(channel, button) {
  if (!channel || !channel.iframe) return;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(channel.iframe);
    } else {
      const area = document.createElement('textarea');
      area.value = channel.iframe;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }

    if (button) {
      button.classList.add('copied');
      const label = button.querySelector('span');
      const oldLabel = label ? label.textContent : '';
      if (label) label.textContent = 'Copiado!';
      button.title = 'Iframe copiado';
      setTimeout(() => {
        button.classList.remove('copied');
        if (label) label.textContent = oldLabel || 'Copiar iframe';
        button.title = 'Copiar iframe';
      }, 1400);
    }
  } catch (err) {
    console.error('Não foi possível copiar o embed:', err);
  }
}

function openPlayer(channel) {
  if (!channel) return;
  state.current = channel;
  document.getElementById('playerTitle').textContent = channel.name;
  document.getElementById('playerCategory').textContent = `${categoryLabels[channel.category] || channel.category} • Ao vivo`;

  const logo = document.getElementById('playerLogo');
  logo.src = channel.image;
  logo.alt = channel.name;

  document.getElementById('playerFrame').src = channel.href;
  document.getElementById('playerModal').classList.add('open');
  document.getElementById('playerModal').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  document.getElementById('playerModal').classList.remove('open');
  document.getElementById('playerModal').setAttribute('aria-hidden', 'true');
  document.getElementById('playerFrame').src = 'about:blank';
  document.body.style.overflow = '';
}

buildCategories();
render();

mainSearch.addEventListener('input', e => setQuery(e.target.value, mainSearch));
headerSearch.addEventListener('input', e => setQuery(e.target.value, headerSearch));

categoryStrip.addEventListener('click', e => {
  const chip = e.target.closest('[data-category]');
  if (!chip) return;
  state.category = chip.dataset.category;
  categoryStrip.querySelectorAll('.category-chip').forEach(btn => btn.classList.toggle('active', btn === chip));
  render();
});

sectionsEl.addEventListener('click', e => {
  const copyButton = e.target.closest('[data-copy-embed]');
  if (copyButton) {
    e.preventDefault();
    const channel = CHANNELS.find(c => c.slug === copyButton.dataset.copyEmbed);
    copyEmbed(channel, copyButton);
    return;
  }

  const previewButton = e.target.closest('[data-preview]');
  if (previewButton) {
    const channel = CHANNELS.find(c => c.slug === previewButton.dataset.preview);
    openPlayer(channel);
    return;
  }

  const prevButton = e.target.closest('[data-carousel-prev]');
  if (prevButton) {
    const track = sectionsEl.querySelector(`[data-carousel="${CSS.escape(prevButton.dataset.carouselPrev)}"]`);
    moveCarousel(track, -1);
    return;
  }

  const nextButton = e.target.closest('[data-carousel-next]');
  if (nextButton) {
    const track = sectionsEl.querySelector(`[data-carousel="${CSS.escape(nextButton.dataset.carouselNext)}"]`);
    moveCarousel(track, 1);
  }
});

sectionsEl.addEventListener('scroll', e => {
  const track = e.target.closest && e.target.closest('[data-carousel]');
  if (track) updateCarouselState(track);
}, true);

window.addEventListener('resize', () => {
  sectionsEl.querySelectorAll('[data-carousel]').forEach(updateCarouselState);
});

document.getElementById('copyEmbedModal').addEventListener('click', e => {
  copyEmbed(state.current, e.currentTarget);
});
document.getElementById('closePlayer').addEventListener('click', closePlayer);
document.getElementById('openExternal').addEventListener('click', () => {
  if (state.current) window.open(state.current.href, '_blank', 'noopener');
});
document.getElementById('playerModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closePlayer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('playerModal').classList.contains('open')) closePlayer();
});

document.getElementById('mobileNavToggle').addEventListener('click', () => {
  document.body.classList.toggle('nav-open');
});
</script>
